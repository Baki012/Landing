<!DOCTYPE html>
<html>
<head>
<style>
body {
  margin: 0;
  background: #000;
  font-family: monospace;
}

/* BIGGER SIDEBAR */
.sidebar {
  display: flex;
  flex-direction: column;
  width: 320px;          /* was 250px */
  height: 100vh;
  padding: 30px;         /* more space */
  background: #0f172a;
}

/* BIGGER TITLE */
.sidebar h1 {
  color: #22d3ee;
  text-align: center;
  margin-bottom: 40px;
  font-size: 36px;       /* bigger text */
}

/* BIGGER MENU BUTTONS */
.sidebar a {
  color: #22d3ee;
  text-decoration: none;
  padding: 18px;         /* bigger buttons */
  margin-bottom: 16px;
  border: 2px solid #22d3ee;
  text-align: center;
  font-size: 20px;       /* bigger text */
  letter-spacing: 2px;
}

.sidebar a:hover {
  background: #22d3ee;
  color: #0f172a;
}
</style>
</head>
<body>

<div class="sidebar">
  <h1>MENU</h1>
  <a href="#">HOME</a>
  <a href="#">ABOUT</a>
  <a href="#">SERVICES</a>
  <a href="#">CONTACT</a>
</div>

</body>
</html>
